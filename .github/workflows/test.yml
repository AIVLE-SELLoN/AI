# 계층 1 — 빠른 검증. 모든 PR 에서 돈다.
#
# 🔴 **시크릿·브로커·LLM 이 하나도 필요 없다.** 902개 테스트가 LLM 호출을 전부
#    monkeypatch 로 대체하고(`tests/`), MQ 테스트는 파일 첫 줄에 "브로커 없이 돈다" 라고
#    적혀 있다. 그래서 이 워크플로는 포크 PR 에서도 그대로 돈다.
#
# ⚠️ `eval/` 은 **절대 넣지 않는다.** LLM 과금이 발생하고 수십 분이 걸린다
#    (`eval/README.md`: "사람이 수동으로 실행한다. CI 에 넣지 말 것").
name: test

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연속 push 하면 앞 실행을 취소한다. main 은 취소하지 않는다
# (머지된 커밋의 결과는 남아 있어야 한다).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # 🔴 3.12 고정. 3.13+ 는 검증 안 됐다 — scipy·chromadb 바이너리 패키지가
      #    3.12 에 묶여 있다(CLAUDE.md "반드시 Python 3.12").
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ⚠️ `data/**` 는 gitignore 라 CI 에 없다. 정본 데이터를 요구하는 테스트는
      #    `skipif` 로 스스로 빠진다(예: test_real_golden_mapping_converts_and_matches_catalog).
      #    로컬 902 passed / CI 는 그만큼 skipped 가 더 나오는 게 정상이다.
      - name: pytest
        run: pytest -q

      # 🔴 **`ruff` 의 종료코드를 `|| true` 로 흡수한다. `set -o pipefail` 을 쓰지 않는다.**
      #    `ruff check .` 는 위반이 있으면 exit 1 을 돌려주는데, 그건 실패가 아니라
      #    **우리가 세려는 값 그 자체**다. 그런데 Actions 기본 셸이 `bash -e` 라
      #    `COUNT=$(...)` 대입이 그 1 을 물고 오는 순간 스크립트가 **비교 전에 중단**된다.
      #    처음엔 pipefail 을 넣었다가 그렇게 죽었다 — 기준선과 무관하게 항상 실패해서
      #    게이트가 아무것도 안 재고 있었다(2026-08-18 PR 체크에서 재현: 0초 만에 exit 1,
      #    `ruff: 62` 조차 안 찍힘).
      #
      # 🔴 **기준선 방식이다. `ruff check .` 를 그대로 게이트로 걸지 않는다.**
      #    지금 main 에 62건이 남아 있어서 그냥 걸면 첫날부터 전 PR 이 빨간불이 된다.
      #    **늘어나는 것만** 막고, 줄이면 아래 숫자를 같이 내린다.
      - name: ruff (기준선 62)
        run: |
          OUT=$(ruff check . 2>&1) || true
          COUNT=$(printf '%s\n' "$OUT" | sed -n 's/^Found \([0-9]*\) error.*/\1/p')
          COUNT=${COUNT:-0}
          echo "ruff: $COUNT (기준선 62)"
          if [ "$COUNT" -gt 62 ]; then
            echo "::error::ruff 위반이 늘었습니다 ($COUNT > 62). 새로 추가된 것만 고치면 됩니다."
            printf '%s\n' "$OUT"
            exit 1
          fi
