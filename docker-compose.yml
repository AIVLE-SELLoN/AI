# SELLoN Mock Producer 파이프라인
#
# 인프라 팀 협의 (2026-08-02, **2026-08-14 개정**):
#   - 분산 코디네이터: KRaft (Zookeeper 제거)
#   - 브로커 : 파티션 : 컨슈머 = **1 : 1 : 1**
#   - 브로커는 EC2 에 올리고, EC2 는 Elastic IP 사용
#     → EXTERNAL 리스너의 advertised host 를 Elastic IP 로 광고해야
#       외부(로컬 PC, Spring Boot)에서 붙을 수 있다.
#
# 🔴 **3:3:1 → 1:1:1 (2026-08-14).** 인프라 세팅은 끝났으나 서버가 열리지 않아 단일
#    브로커로 확정했다. **복제 수를 함께 내려야 한다** — 브로커만 1대로 줄이면 토픽
#    생성이 실패한다:
#      · `--replication-factor 3` → 브로커가 3대 미만이면 create 가 거부된다
#      · `min.insync.replicas=2`  → 통과해도 발행이 NOT_ENOUGH_REPLICAS 로 막힌다
#    그래서 아래 여섯 값이 **한 세트다**: NUM_PARTITIONS · DEFAULT_REPLICATION_FACTOR ·
#    MIN_INSYNC_REPLICAS · OFFSETS_TOPIC_REPLICATION_FACTOR ·
#    TRANSACTION_STATE_LOG_{REPLICATION_FACTOR,MIN_ISR} + kafka-init 의 인자.
#    (브로커 수에 실제로 걸리는 건 **복제 다섯**이다. NUM_PARTITIONS 는 파티션 > 브로커도
#     합법이라 실패하지 않고, 1:1:1 협의 비율에 맞춰 같이 내린 값이다.)
#
#    ⚠️ **단일 브로커는 내구성이 없다.** 그 노드가 죽으면 미소비 메시지가 사라진다.
#       목 파이프라인은 CSV 대본을 다시 재생하면 되므로 감수한다. 브로커를 늘릴 때는
#       위 값들을 **같이** 올려야 한다(하나만 올리면 조용히 복제가 안 된다).
#
# 🔴 **3-브로커 시절 볼륨이 남아 있으면 kafka-1 이 아예 기동하지 못한다** — 기존 compose 를
#    한 번이라도 up 한 사람은 반드시 읽을 것. kafka-1-data 의 KRaft 상태 파일에 voter
#    [1, 2, 3] 이 박혀 있어 지금 설정(voter [1])과 충돌한다:
#      IllegalStateException: Configured voter set: [1] is different from the voter set
#      read from the state file: [1, 2, 3]. ... wipe out the local state file if necessary
#    KRaft static quorum 의 동작이라 compose 설정으로는 못 막는다. 게다가
#    `restart: unless-stopped` 라 화면에는 에러 없이 Waiting/starting 만 반복해서
#    `docker compose logs kafka-1` 을 열기 전엔 원인이 안 보인다. 조치는 볼륨 삭제:
#      docker compose down -v
#      docker volume rm ai_kafka-2-data ai_kafka-3-data
#    ⚠️ 아래 volumes: 에 kafka-2/3 정의가 없어 **`down -v` 로는 그 둘이 안 지워진다.**
#       그래서 두 번째 줄이 따로 필요하다(프로젝트명 ai = 이 디렉터리 이름).
#
# 워크플로우 회의 (2026-08-02):
#   - 분류 워커는 Kafka 를 구독하지 않고 raw DB(mock_producer 가 적재)를 참조하도록 바뀌어
#     이 compose 에서 빠졌다. 컨테이너 밖에서 직접 실행한다:
#       python scripts/classification_worker.py --limit 50     # 시험 실행(과금 상한)
#       python scripts/classification_worker.py --follow       # 상시 추종 — 전량 과금 주의
#     ⚠️ data/ 에 원문이 12.8만 건 있다. --limit 없이 --follow 로 돌리면 전량이 LLM 으로 간다.
#   - 따라서 여기 남는 건 브로커 1대 + 토픽 초기화 + mock producer 뿐이다.
#     협의상 "컨슈머 1"은 raw.* 토픽을 구독하는 쪽(인프라/Spring Boot)이 맡는다.
#
# 실행 전 .env 에 아래 값을 채울 것:
#   KAFKA_EXTERNAL_HOST=<EC2 Elastic IP>   # 로컬 개발 시엔 localhost (기본값)

networks:
  app-network:
    driver: bridge

volumes:
  kafka-1-data:
  rabbitmq-data:

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.5.0
  networks:
    - app-network
  restart: unless-stopped

# KRaft 설정. 지금은 브로커가 1대지만 anchor 를 유지한다 — 늘릴 때 브로커별로 다른
# 값(NODE_ID / LISTENERS / ADVERTISED_LISTENERS / 포트)만 각 서비스에서 덮으면 된다.
x-kafka-env: &kafka-env
  # --- KRaft ---
  # 단일 노드가 broker + controller 겸용(combined mode). 쿼럼도 자기 자신 하나뿐이다.
  # 브로커를 늘리면 **전 노드의 voters 목록이 같아야** 한다(하나만 고치면 기동 실패).
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # 클러스터 최초 포맷 시 사용되는 ID. 노드를 늘리면 같은 값이어야 한 클러스터로 묶인다.
  # 바꾸면 기존 볼륨과 불일치로 기동 실패 → 바꿀 거면 볼륨도 같이 지울 것.
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # --- 리스너 ---
  # INTERNAL  : 컨테이너 간 통신(mock-producer, worker, 브로커 간) — kafka-N:29092
  # EXTERNAL  : EC2 밖에서의 접속 — <Elastic IP>:909X
  # CONTROLLER: KRaft 쿼럼 전용 — 절대 advertised 에 넣지 않는다.
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  # --- 복제/파티션 기본값 (브로커 1) ---
  # NUM_PARTITIONS 는 브로커 수 제약이 아니다 — 파티션 > 브로커도 합법이라 그대로 둬도
  # 실패하지 않는다. 협의된 1:1:1 비율을 따라 같이 내린 값이라 늘릴 때도 같이 올린다.
  KAFKA_NUM_PARTITIONS: 1
  # 🔴 아래 **복제 다섯 값**은 브로커 수와 한 세트다. 브로커만 바꾸고 여기를 두면
  #    토픽 생성(RF > 브로커 수)이나 발행(min ISR 미달)이 실패한다.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 1
  KAFKA_MIN_INSYNC_REPLICAS: 1
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # 토픽은 kafka-init 에서 파티션 1 / RF 1 로 명시 생성한다.
  # 오타 토픽이 자동 생성돼 조용히 유실되는 걸 막기 위해 자동 생성은 끈다.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

services:
  kafka-1:
    <<: *kafka-common
    container_name: ai-kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # 토픽을 파티션 1 / RF 1 로 미리 만들고 끝나는 1회성 서비스.
  # (자동 생성을 껐으므로 이 단계가 없으면 producer 가 UNKNOWN_TOPIC 으로 실패한다.)
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: ["/bin/bash", "-c"]
    # 🔴 command 는 **리스트 + 블록 스칼라**여야 한다(문자열로 되돌리지 말 것).
    #    문자열로 주면 compose 가 shell-lex 로 쪼개면서 **줄 끝 `\`(라인 연속)만 지우고
    #    개행은 남긴다** → 첫 줄이 그대로 완결 명령이 되어
    #      Command must include exactly one action: --list, --describe, --create ...
    #    로 죽는다(`docker inspect ai-kafka-init` 의 Cmd 로 확인 가능). set -e 라 곧바로
    #    exit 1 → mock-producer 는 service_completed_successfully 를 영원히 기다린다.
    #    리스트로 주면 lex 를 안 거쳐 `\` 가 bash 까지 그대로 간다.
    #    (`$$` 는 리스트에서도 필요하다 — 변수 보간은 문자열/리스트 구분 없이 적용된다.)
    command:
      - |
        set -e
        BS=kafka-1:29092
        for t in raw.orders raw.inquiries raw.reviews raw.detail_changes; do
          kafka-topics --bootstrap-server $$BS \
            --create --if-not-exists \
            --topic $$t --partitions 1 --replication-factor 1 \
            --config min.insync.replicas=1
        done
        echo '--- topics ---'
        kafka-topics --bootstrap-server $$BS --list

  mock-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-mock-producer-1
    # --speed 100 : 대본 CSV 를 100배속으로 재생
    command: >
      python -u scripts/mock_producer.py
      --bootstrap-servers kafka-1:29092
      --speed 100
      --raw-db /app/data/raw.db
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # 저장소를 통째로(.:/app) 마운트하지 않는다 — .env·.chroma 까지 컨테이너에 들어간다.
      # 필요한 것만: 스크립트(읽기 전용) + data(raw.db 를 호스트에 남겨야 하므로 쓰기 가능).
      # ⚠️ 이미지에도 scripts/ 가 들어 있다(PR #95). 이 마운트는 **호스트 코드를 덮어쓰는**
      #    개발 편의용이다 — 고치고 다시 빌드하지 않아도 반영된다.
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
    # ⚠️ EC2(Linux)에서는 컨테이너가 root 로 raw.db 를 만들어 호스트 워커가 못 열 수 있다.
    #    그 경우 아래를 열어 호스트 사용자 UID/GID 로 맞춘다(.env 에 값 지정).
    # user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    networks:
      - app-network
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # 정량 실험 실행용 (서영님 실험① 등). 기본 기동에는 안 뜨고 프로필로만 올라온다:
  #   docker compose --profile eval run --rm eval-runner
  # ⚠️ eval/ 은 이미지에 없으므로(운영에 불필요) 마운트로 넣어야 한다. scripts/ 는
  #    이미지에도 있지만 여기서는 호스트 최신본을 쓰려고 같이 붙인다(PR #95).
  #    golden 은 채점 정답지라 읽기 전용으로만 붙인다(eval/README.md 원칙).
  eval-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-eval-runner
    command: python eval/run_detection_eval.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./eval:/app/eval:ro
      - ./scripts:/app/scripts:ro
      - ./data/golden:/app/data/golden:ro
      - ./data/input:/app/data/input:ro
      - ./data/config:/app/data/config:ro
    profiles: ["eval"]

  # RabbitMQ — AI → 메인 이벤트 발행 (docs/mq_events.md).
  #
  # ⚠️ **이건 로컬 검증용이다. 운영 브로커는 백엔드가 띄운다.**
  #    운영 접속 정보(C1)를 기다리는 동안 "메시지가 실제로 오가는지"를 확인하려고 둔다 —
  #    MQ_ENABLED=false 로 두면 "안 터진다"만 확인되고 발행 자체는 검증이 안 된다.
  #    (Kafka 를 우리가 띄워서 유입 구간을 검증한 것과 같은 방식)
  #
  # 접속 정보가 오면 .env 의 접속 4개(HOST/PORT/USER/PASSWORD)를 그쪽으로 돌리고
  # 이 서비스는 안 띄우면 된다.
  #
  # 🔴 **그때 MQ_DECLARE_TOPOLOGY=false · MQ_VHOST=/app 도 같이 내릴 것.** 접속만 바꾸면
  #    발행·수신이 MqConfigError 로 멈춘다 — resolve_exchange()·resolve_queue() 가
  #    플래그와 함께 MQ_HOST 도 보고, 로컬이 아니면 브로커에 가기 전에 세운다
  #    (require_local_topology_target). setup_local_mq.py 도 같은 판정을 쓴다.
  #    **이건 고장이 아니라 의도다** — 그 조합이 통과하면 아직 없는 운영 exchange·큐를
  #    우리가 quorum·DLX·TTL 없이 선점하고, 백엔드가 정상 토폴로지를 올릴 때 그쪽이
  #    터진다. 메시지가 무엇을 내리라고 알려주므로 그대로 따르면 된다.
  #
  #   docker compose up -d rabbitmq
  #   python scripts/setup_local_mq.py   ← ⚠️ 이걸 안 하면 발행이 전부 실패한다(아래 참고)
  #   관리 UI: http://localhost:15672  (기본 sellon/sellon — 큐·메시지를 눈으로 본다)
  #
  # ⚠️ **큐는 이 compose 가 만들지 않는다.** 운영에서 main.inbound·ai.inbound 는 백엔드
  #    인프라가 만들고 우리는 발행·구독만 한다(mq_events.md §2-1). 그래서 빈 브로커에는
  #    ai.# 를 받는 큐가 없고, 토픽 exchange 는 받는 큐가 없으면 메시지를 버린다 —
  #    발행이 MqPublishError(unroutable) 로 실패한다. setup_local_mq.py 가 그 대역을 만든다.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sellon-rabbitmq
    networks:
      - app-network
    ports:
      - "5672:5672"      # AMQP — app/core/mq.py 가 붙는 포트
      - "15672:15672"    # 관리 UI
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-sellon}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:-sellon}
      RABBITMQ_DEFAULT_VHOST: ${MQ_VHOST:-/}
    volumes:
      # 볼륨이 없으면 재시작마다 exchange·큐·바인딩이 통째로 날아간다. 그러면 발행이
      # unroutable 로 **실패**하므로(위 ⚠️ 참고) setup_local_mq.py 를 다시 돌려야 한다.
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
