# SELLoN Mock Producer 파이프라인
#
# 인프라 팀 협의 (2026-08-02):
#   - 분산 코디네이터: KRaft (Zookeeper 제거)
#   - 브로커 : 파티션 : 컨슈머 = 3 : 3 : 1  (추후 변경 가능)
#   - 브로커는 EC2 에 올리고, EC2 는 Elastic IP 사용
#     → EXTERNAL 리스너의 advertised host 를 Elastic IP 로 광고해야
#       외부(로컬 PC, Spring Boot)에서 붙을 수 있다.
#
# 워크플로우 회의 (2026-08-02):
#   - 분류 워커는 Kafka 를 구독하지 않고 raw DB(mock_producer 가 적재)를 참조하도록 바뀌어
#     이 compose 에서 빠졌다. 컨테이너 밖에서 직접 실행한다:
#       python scripts/classification_worker.py --limit 50     # 시험 실행(과금 상한)
#       python scripts/classification_worker.py --follow       # 상시 추종 — 전량 과금 주의
#     ⚠️ data/ 에 원문이 12.8만 건 있다. --limit 없이 --follow 로 돌리면 전량이 LLM 으로 간다.
#   - 따라서 여기 남는 건 브로커 3대 + 토픽 초기화 + mock producer 뿐이다.
#     협의상 "컨슈머 1"은 raw.* 토픽을 구독하는 쪽(인프라/Spring Boot)이 맡는다.
#
# 실행 전 .env 에 아래 값을 채울 것:
#   KAFKA_EXTERNAL_HOST=<EC2 Elastic IP>   # 로컬 개발 시엔 localhost (기본값)

networks:
  app-network:
    driver: bridge

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.5.0
  networks:
    - app-network
  restart: unless-stopped

# 3개 브로커가 공유하는 KRaft 설정.
# 브로커별로 다른 값(NODE_ID / LISTENERS / ADVERTISED_LISTENERS / 포트)은
# 각 서비스에서 따로 지정한다.
x-kafka-env: &kafka-env
  # --- KRaft ---
  # 3노드 모두 broker + controller 겸용(combined mode). 쿼럼 과반 = 2.
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # 클러스터 최초 포맷 시 사용되는 ID. 3노드가 같은 값이어야 한 클러스터로 묶인다.
  # 바꾸면 기존 볼륨과 불일치로 기동 실패 → 바꿀 거면 볼륨도 같이 지울 것.
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # --- 리스너 ---
  # INTERNAL  : 컨테이너 간 통신(mock-producer, worker, 브로커 간) — kafka-N:29092
  # EXTERNAL  : EC2 밖에서의 접속 — <Elastic IP>:909X
  # CONTROLLER: KRaft 쿼럼 전용 — 절대 advertised 에 넣지 않는다.
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  # --- 복제/파티션 기본값 (브로커 3) ---
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # 토픽은 kafka-init 에서 파티션 3 / RF 3 으로 명시 생성한다.
  # 오타 토픽이 자동 생성돼 조용히 유실되는 걸 막기 위해 자동 생성은 끈다.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

services:
  kafka-1:
    <<: *kafka-common
    container_name: ai-kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-2:
    <<: *kafka-common
    container_name: ai-kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-3:
    <<: *kafka-common
    container_name: ai-kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # 토픽을 파티션 3 / RF 3 으로 미리 만들고 끝나는 1회성 서비스.
  # (자동 생성을 껐으므로 이 단계가 없으면 producer 가 UNKNOWN_TOPIC 으로 실패한다.)
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      set -e
      BS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      for t in raw.orders raw.inquiries raw.reviews raw.detail_changes; do
        kafka-topics --bootstrap-server $$BS \
          --create --if-not-exists \
          --topic $$t --partitions 3 --replication-factor 3 \
          --config min.insync.replicas=2
      done
      echo '--- topics ---'
      kafka-topics --bootstrap-server $$BS --list
      "

  mock-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-mock-producer-1
    # --speed 100 : 대본 CSV 를 100배속으로 재생
    command: >
      python -u scripts/mock_producer.py
      --bootstrap-servers kafka-1:29092,kafka-2:29092,kafka-3:29092
      --speed 100
      --raw-db /app/data/raw.db
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # 저장소를 통째로(.:/app) 마운트하지 않는다 — .env·.chroma 까지 컨테이너에 들어간다.
      # 필요한 것만: 스크립트(읽기 전용) + data(raw.db 를 호스트에 남겨야 하므로 쓰기 가능).
      # ⚠️ Dockerfile 은 app/ 만 COPY 하므로 scripts/ 는 이 마운트로만 들어온다.
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
    # ⚠️ EC2(Linux)에서는 컨테이너가 root 로 raw.db 를 만들어 호스트 워커가 못 열 수 있다.
    #    그 경우 아래를 열어 호스트 사용자 UID/GID 로 맞춘다(.env 에 값 지정).
    # user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    networks:
      - app-network
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # 정량 실험 실행용 (서영님 실험① 등). 기본 기동에는 안 뜨고 프로필로만 올라온다:
  #   docker compose --profile eval run --rm eval-runner
  # ⚠️ Dockerfile 이 app/ 만 COPY 하므로 eval/·scripts/ 는 마운트로 넣어야 한다.
  #    golden 은 채점 정답지라 읽기 전용으로만 붙인다(eval/README.md 원칙).
  eval-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-eval-runner
    command: python eval/run_detection_eval.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./eval:/app/eval:ro
      - ./scripts:/app/scripts:ro
      - ./data/golden:/app/data/golden:ro
      - ./data/input:/app/data/input:ro
      - ./data/config:/app/data/config:ro
    profiles: ["eval"]
