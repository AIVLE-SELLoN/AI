cs:
  색상:
    "-1":
      - "제가 주문한 색이랑 실제로 받은 색이 너무 달라요. 교환 가능할까요?"
      - "상세페이지 사진에서 본 색이랑 실물이 너무 차이나네요. 반품하고 싶은데 어떻게 해야 하나요?"
      - "화면으로 볼 때보다 실물이 훨씬 칙칙한데, 원래 이런 색인가요?"
      - "화면으로 볼때는 예쁜 연핑크 색이었는데 실물은 완전 진한 핑크색이에요. 환불 요청드립니다."
      - "색깔이 사진이랑 완전 다르게 와서 당황했어요. 반품 가능할까요?"
    "0":
      - "옵션에 있는 카키색 실제 톤이 궁금해요."
      - "이 색상 재입고 예정 있나요?"
      - "모델 착용 컷이랑 상세 컷 중에 실제와 가까운 건 뭔가요?"
    "1":
      - "색이 사진이랑 다를까봐 걱정했는데 똑같이 예쁘게 왔어요."
      - "생각했던 컬러 그대로 와서 만족합니다."

  사이즈:
    "-1":
      - "사이즈표대로 주문했는데 실측이랑 많이 달라요. 환불 가능한가요?"
      - "생각보다 훨씬 크게 와서 반품하고 싶어요."
      - "표기 사이즈보다 작게 온 것 같은데 교환 가능할까요?"
      - "모델핏이랑 실제랑 너무 다르게 나왔어요. 사이즈 다시 확인해주실 수 있나요?"
      - "실측 사이즈 문의드려요, 표기랑 차이나는 것 같아서요."
    "0":
      - "이 제품 사이즈가 크게 나오는 편인가요?"
      - "평소 사이즈로 주문해도 괜찮을까요?"
      - "실측 사이즈 알 수 있을까요?"
    "1":
      - "사이즈 딱 맞게 잘 왔어요."
      - "표기 그대로 정사이즈로 왔습니다."

  소재:
    "-1":
      - "원단이 설명이랑 다르게 너무 얇은데, 정상 제품 맞나요?"
      - "소재가 까슬거려서 불편한데 반품 가능할까요?"
      - "생각보다 원단 재질이 별로라 교환하고 싶어요."
      - "세탁 후 원단이 많이 상했는데 원래 이런 소재인가요?"
      - "비침이 없다고 했는데 비침이 심한 재질이에요. 확인 부탁드려요."
    "0":
      - "이 제품 소재가 신축성이 있는 편인가요?"
      - "원단이 두꺼운 편인지 궁금합니다."
      - "세탁 시 주의할 점 있을까요?"
    "1":
      - "원단 재질이 좋아서 만족합니다."
      - "소재가 부드럽고 고급스러워 보여서 좋아요."

  파손:
    "-1":
      - "박스를 열어보니 제품이 손상돼 있었어요. 교환 부탁드립니다."
      - "지퍼가 고장난 채로 왔어요. 환불 처리 가능할까요?"
      - "제품에 이염이 있는데 정상 제품 맞나요?"
      - "봉제가 뜯어진 상태로 왔습니다. 교환 요청드려요."
      - "제품에 스크래치가 나 있어요. 확인 후 답변 부탁드립니다."
    "0":
      - "파손 방지 포장이 되어있나요?"
      - "배송 중 파손되면 어떻게 처리되나요?"
      - "꼼꼼하게 포장해서 배송이 오는 편인가요?"
    "1":
      - "포장 꼼꼼하게 잘 되어있어서 안전하게 왔어요."
      - "파손 없이 깔끔하게 잘 도착했습니다."

  오배송:
    "-1":
      - "제가 주문한 것과 다른 상품이 왔어요. 빠른 교환 부탁드립니다."
      - "M 사이즈 시켰는데 S 사이즈가 배달왔어요. 재발송 가능한가요?"
      - "완전히 다른 제품이 도착했습니다. 확인 부탁드려요."
      - "주문 내역과 배송된 상품이 일치하지 않는데 어떻게 처리되나요?"
      - "카키색을 주문했는데 검은색이 왔어요. 교환해주세요."
    "0":
      - "발송 전에 주문 옵션 확인 가능한가요?"
      - "주문이 제대로 접수됐는지 확인 부탁드려요."
      - "배송 전 옵션 변경도 가능한가요?"
    "1":
      - "주문한 옵션 그대로 정확하게 왔어요."
      - "주문 내역이랑 배송된 상품이 정확히 일치해요."

  기타:
    "-1":
      - "결제는 됐는데 주문 내역에 안 떠요. 확인 부탁드립니다."
      - "배송이 너무 지연되고 있어요. 언제쯤 받을 수 있을까요?"
      - "고객센터 연결이 계속 안 되는데 어떻게 문의드려야 하나요?"
      - "환불 처리가 너무 늦어지고 있어요. 진행 상황 확인 부탁드려요."
      - "취소 요청했는데 아직도 처리가 안 됐어요. 확인해주세요."
    "0":
      - "이 제품 재입고는 언제쯤 될까요?"
      - "교환 절차가 어떻게 되나요?"
      - "배송 조회가 안 되는데 확인 부탁드려요."
    "1":
      - "빠른 배송 감사합니다."
      - "문의 답변 빨리 주셔서 감사해요."

review:
  색상:
    "-1":
      - "상세컷보다 실물이 훨씬 어두워요."
      - "실물 색이 사진이랑 많이 다르네요."
      - "생각한 색이랑 달라서 아쉬워요."
      - "색상이 화면에서 본 거랑 차이가 좀 있어요."
      - "칼라가 기대했던 것보다 탁해요."
    "0":
      - "색상은 무난한 편이에요."
      - "색은 그냥 평범해요."
      - "화면이랑 비슷하지만 약간 다른 느낌이에요."
    "1":
      - "색감이 예쁘게 잘 나왔어요."
      - "사진이랑 똑같은 색이라 만족합니다."

  사이즈:
    "-1":
      - "사이즈가 생각보다 크게 나왔어요."
      - "표기보다 작아서 한 치수 크게 사야 할 것 같아요."
      - "핏이 좀 애매하게 떨어져요."
      - "실측이랑 표기가 안 맞는 것 같아요."
      - "사이즈가 안 맞아서 교환했어요."
    "0":
      - "사이즈는 무난하게 맞았어요."
      - "평소 사이즈로 딱 맞았어요."
      - "정사이즈로 무난해요."
    "1":
      - "사이즈 딱 맞고 핏이 예뻐요."
      - "표기 그대로 정사이즈로 잘 맞아요."

  소재:
    "-1":
      - "원단이 얇아서 비침이 좀 있어요."
      - "소재가 까슬거려서 아쉬워요."
      - "생각보다 저렴한 느낌의 원단이에요."
      - "세탁 후에 좀 옷이 빨리 상하는 느낌이에요."
      - "촉감이 기대했던 것보다 별로예요."
    "0":
      - "소재는 딱 한 철 입을 정도, 평범한 편이에요."
      - "무난한 원단이에요."
      - "두께감은 보통이에요."
    "1":
      - "원단이 부드럽고 좋아요."
      - "소재 좋고 신축성도 있어요."
